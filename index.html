<body>

<header>
  <div class="band"><div class="wrap">
    <span>עומר המקום שלך לגדול</span>
  </div></div>
  <div class="hero"><div class="wrap">
    <div class="stripes" aria-hidden="true"></div>
    <h1>״פאב קהילתי״</h1>
    <div class="meta"><span>חמישי</span><span><bdi dir="ltr">20:00–23:00</bdi></span><span>דפנה 10</span></div>
  </div></div>
</header>

<div class="photo wrap">
  <img src="images/pub-scene.jpg" width="800" height="778" alt="הפאב הקהילתי בלילה: אורות תלויים על העצים וספסלי עץ מלאים באנשים.">
</div>

<main class="menu"><div class="wrap" id="menu"></div></main>

<div class="foot wrap">מועצה מקומית עומר · מרכז קהילתי עומר</div>

<div class="bar"><div class="wrap">
  <span class="count" id="count">0</span>

</div></div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden aria-label="העגלה שלי"><div class="wrap">
  <div class="grab"></div>
  <div class="sheet-head">
    <h2>העגלה שלי</h2>
    <button class="btn-round close" id="closeCart" aria-label="סגירה">×</button>
  </div>
  <div class="lines" id="lines"></div>
  <div class="sum"><span>סה״כ לתשלום</span><b id="sumTotal">₪0</b></div>
  <div class="pay-label">בחרו איך לשלם:</div>
  <div class="pay">
    <a class="bit" id="payBit" href="#" target="_blank" rel="noopener">bit<small>מעבר לביט</small></a>
    <a class="paybox" id="payBox" href="#" target="_blank" rel="noopener">PayBox<small>מעבר לפייבוקס</small></a>
  </div>
  <p class="hint" id="payHint"></p>
  <button class="clear" id="clear">ריקון העגלה</button>
</div></section>

<script src="products.js"></script>
<script src="app.js"></script>
